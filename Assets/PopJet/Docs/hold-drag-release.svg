<line x1="442.5" y1="143.4" x2="457.3" y2="137.3" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
<line x1="438.9" y1="140.4" x2="442.2" y2="124.7" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
<circle class="zone" cx="377.8" cy="217.7" r="24"/>
