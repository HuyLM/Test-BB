<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="630" viewBox="0 0 680 315" font-family="Arial, Helvetica, sans-serif">
<title>Pop Jet - giữ, kéo, thả</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:bold;fill:#2C2C2A}
