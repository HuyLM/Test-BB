.zone{fill:none;stroke:#2C2C2A;stroke-width:0.5;stroke-dasharray:3 3}
</style>
</defs>
<rect width="680" height="315" fill="#FFFFFF"/>

<rect class="panel" x="40" y="40" width="135" height="225" rx="8"/>
