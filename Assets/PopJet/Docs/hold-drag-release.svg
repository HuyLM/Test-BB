<circle class="finger" cx="316.3" cy="105.3" r="9"/>
<line x1="262.5" y1="170" x2="230.5" y2="208.5" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
