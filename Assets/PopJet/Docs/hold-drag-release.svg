.panel{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.5}
.balloon{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}
.finger{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
